<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PK SNCF – prototype</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8102e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mut:#667085;--ac:#c8102e;--wbg:#0b0f16;--wtx:#fff;--bd:#d9dde3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#181d25;--tx:#eef0f4;--mut:#98a2b3;--bd:#2a313c;--wbg:#000}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#181d25;--tx:#eef0f4;--mut:#98a2b3;--bd:#2a313c;--wbg:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:800px){main{grid-template-columns:340px minmax(0,1fr)}}
h1{font-size:18px;margin:0 0 2px}h2{font-size:14px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.watchwrap{display:flex;justify-content:center;padding:6px 0 12px}
.watch{width:260px;height:260px;border-radius:50%;background:var(--wbg);color:var(--wtx);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:8px solid #2b3340;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.watch.sq{border-radius:34px}
.w-line{font-size:14px;opacity:.75;letter-spacing:.03em}
.w-pk{font-size:56px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.w-pk small{font-size:22px;font-weight:600;opacity:.8}
.w-sub{font-size:13px;opacity:.7;margin-top:4px}
.w-st{margin-top:8px;font-size:12px;padding:2px 10px;border-radius:20px;background:#1f7a3d}
.w-st.off{background:#8a5a00}.w-st.none{background:#444}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input,button,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
input[type=range]{width:100%;padding:0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
#map{width:100%;height:280px;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.note{font-size:12.5px;color:var(--mut)}
code{background:var(--bg);padding:1px 5px;border-radius:5px}
#lmap{width:100%;height:360px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
.wb{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<main>
<section>
  <div class="card">
    <h1>PK SNCF</h1>
    <div class="note" id="src">Chargement de la base…</div>
    <div class="watchwrap"><div class="watch" id="watch">
      <div class="w-line" id="wl">Ligne —</div>
      <div class="w-pk" id="wp">0<small>+000</small></div>
      <div class="w-sub" id="ws">Recherche du GPS…</div>
      <div class="w-st none" id="wst">en attente</div>
    </div></div>
    <div class="row">
      <button id="voice">🔇 Voix désactivée</button>
      <button id="fmt">Format : 12+400</button>
      <button id="shape">Rond / carré</button>
    </div>
    <div class="note" id="gpsmsg" style="margin-top:8px"></div>
    <div class="row" id="gpsrow" style="display:none;margin-top:6px"><button class="p" id="gps">Activer le GPS</button></div>
  </div>
</section>
<section style="display:grid;gap:16px">
  <div class="card">
    <h2>Carte · points d’accès</h2>
    <div id="lmap"></div>
  </div>
  <div class="card">
    <h2>Aller à un PK</h2>
    <div class="row">
      <input id="pkin" inputmode="decimal" placeholder="PK, ex. 258,4">
      <button class="p" id="go">Navigation vers l’accès le plus proche</button>
    </div>
    <div class="note" id="gomsg" style="margin-top:8px"></div>
  </div>
</section>
</main>
<script>
(function(){
  var lines={}, loading=true, decimal=false, watchId=null, cur=null, last=null, lastHm=null, voiceOn=false, acces=[], map=null, me=null, first=true, DEF='930000';
  var $=function(i){return document.getElementById(i)};
  var grid=new Map(),CS=0.05;
  function gk(i,j){return (i+5000)*20000+(j+5000)}
  function buildGrid(){
    grid=new Map();
    Object.keys(lines).forEach(function(k){var L=lines[k];for(var i=0;i<L.length;i++){var p=L[i];p.i=i;var key=gk(Math.floor(p.lat/CS),Math.floor(p.lon/CS));var a=grid.get(key);if(a)a.push(p);else grid.set(key,[p])}});
  }
  function locate(lat,lon,only){
    var k=Math.cos(lat*Math.PI/180),best=null,ci=Math.floor(lat/CS),cj=Math.floor(lon/CS);
    function X(p){return (p.lon-lon)*111.32*k}
    function Y(p){return (p.lat-lat)*110.57}
    function tryPt(p){if(only&&p.l!==only)return;var x=X(p),y=Y(p),d=Math.sqrt(x*x+y*y);if(!best||d<best.d)best={d:d,l:p.l,pk:p.pk}}
    function trySeg(a,b){if(only&&a.l!==only)return;
      if(b.pk-a.pk>5||b.pk<a.pk)return;
      var ax=X(a),ay=Y(a),dx=X(b)-ax,dy=Y(b)-ay,len2=dx*dx+dy*dy;if(len2<=0)return;
      var t=Math.max(0,Math.min(1,-(ax*dx+ay*dy)/len2)),qx=ax+t*dx,qy=ay+t*dy,dd=Math.sqrt(qx*qx+qy*qy);
      if(!best||dd<best.d)best={d:dd,l:a.l,pk:a.pk+t*(b.pk-a.pk)};
    }
    for(var r=0;r<=6;r++){
      for(var di=-r;di<=r;di++)for(var dj=-r;dj<=r;dj++){
        if(Math.max(Math.abs(di),Math.abs(dj))!==r)continue;
        var a=grid.get(gk(ci+di,cj+dj));if(!a)continue;
        for(var n=0;n<a.length;n++){var p=a[n],L=lines[p.l];tryPt(p);if(p.i>0)trySeg(L[p.i-1],p);if(p.i<L.length-1)trySeg(p,L[p.i+1])}
      }
      if(best&&best.d<=r*CS*110*k)break;
    }
    if(best)best.d*=1000;
    return best;
  }
  function fmtPk(pk){
    var km=Math.floor(pk),m=Math.round((pk-km)*1000);
    if(m===1000){km++;m=0}
    if(decimal)return km+','+String(m).padStart(3,'0');
    return km+'+'+String(m).padStart(3,'0');
  }

  function pkNum(v){
    if(v==null||v==='')return NaN;
    if(typeof v==='number')return v;
    v=String(v).trim();
    var m=v.match(/^(\d+)\s*\+\s*(\d+)$/);
    if(m)return parseInt(m[1],10)+parseInt(m[2],10)/1000;
    return parseFloat(v.replace(',','.'));
  }
  
  function setData(arr){
    lines={};
    arr.forEach(function(p){(lines[p.l]=lines[p.l]||[]).push(p)});
    Object.keys(lines).forEach(function(k){lines[k].sort(function(x,y){return x.pk-y.pk})});
    buildGrid();
    $('src').textContent='Base SNCF · '+arr.length.toLocaleString('fr-FR')+' points, '+Object.keys(lines).length+' lignes';
  }
  function renderPk(pk){
    var p=fmtPk(pk).split(/[+,]/);
    $('wp').innerHTML=p[0]+'<small>'+(decimal?',':'+')+p[1]+'</small>';
  }
  /* ---------- voix ---------- */
  function say(t){
    if(!voiceOn||!window.speechSynthesis)return;
    var u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.cancel();speechSynthesis.speak(u);
  }
  function announce(pk){
    if(pk<0)return;
    var hm=Math.floor(pk*10+1e-6);
    if(hm===lastHm)return;
    lastHm=hm;
    var km=Math.floor(hm/10),m=(hm%10)*100;
    say('PK '+km+(m?', '+m+' mètres':' pile'));
  }
  $('voice').onclick=function(){
    voiceOn=!voiceOn;
    $('voice').textContent=voiceOn?'🔊 Voix activée':'🔇 Voix désactivée';
    if(voiceOn){lastHm=null;say('Annonces vocales activées')}else if(window.speechSynthesis)speechSynthesis.cancel();
  };
  /* ---------- carte ---------- */
  function initMap(){
    if(!window.L)return;
    map=L.map('lmap',{preferCanvas:true}).setView([46.6,2.4],6);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  }
  function drawLine(){
    if(!map||!lines[DEF])return;
    var L0=lines[DEF],ll=[];for(var i=0;i<L0.length;i+=3)ll.push([L0[i].lat,L0[i].lon]);
    var pl=L.polyline(ll,{color:'#667085',weight:3}).addTo(map);
    if(first)map.fitBounds(pl.getBounds());
  }
  function navUrl(a){return 'https://www.google.com/maps/dir/?api=1&destination='+a.lat+','+a.lon+'&travelmode=driving&dir_action=navigate'}
  function drawAcces(){
    acces.forEach(function(a){
      if(a.pk==null){var r=locate(a.lat,a.lon,DEF);a.pk=r?r.pk:null}
      if(map)L.circleMarker([a.lat,a.lon],{radius:5,color:'#fff',weight:1,fillColor:'#1d6fe0',fillOpacity:1}).addTo(map)
        .bindPopup('<b>'+a.n+'</b>'+(a.pk!=null?'<br>PK '+fmtPk(a.pk)+(a.l?' · ligne '+a.l:''):'')+'<br><a href="'+navUrl(a)+'" target="_blank">Y aller</a>');
    });
  }
  function moveMap(lat,lon){
    if(!map)return;
    if(!me)me=L.circleMarker([lat,lon],{radius:9,color:'#fff',weight:3,fillColor:'#c8102e',fillOpacity:1}).addTo(map);
    me.setLatLng([lat,lon]);
    if(first){map.setView([lat,lon],14);first=false}else map.panTo([lat,lon]);
  }
  /* ---------- position ---------- */
  function onFix(lat,lon){
    last=[lat,lon];
    if(loading)return;
    var r=locate(lat,lon),st=$('wst');cur=r;
    moveMap(lat,lon);
    if(!r){$('wl').textContent='Ligne —';$('ws').textContent='aucune ligne à moins de 30 km';st.className='w-st none';st.textContent='hors ligne';return}
    $('wl').textContent='Ligne '+r.l;
    renderPk(r.pk);
    $('ws').textContent='à '+Math.round(r.d)+' m de la voie';
    if(r.d<150){st.className='w-st';st.textContent='sur la ligne'}
    else if(r.d<1000){st.className='w-st off';st.textContent='proche de la ligne'}
    else{st.className='w-st none';st.textContent='hors ligne (>1 km)'}
    if(r.d<300)announce(r.pk);
  }
  function startGps(){
    if(!navigator.geolocation){$('gpsmsg').textContent='GPS indisponible dans ce navigateur.';return}
    if(watchId!==null)navigator.geolocation.clearWatch(watchId);
    $('gpsmsg').textContent='Recherche de la position…';
    watchId=navigator.geolocation.watchPosition(function(p){
      $('gpsrow').style.display='none';
      $('gpsmsg').textContent='GPS actif · précision ±'+Math.round(p.coords.accuracy)+' m'+(p.coords.accuracy>200?' (peu précis)':'');
      onFix(p.coords.latitude,p.coords.longitude);
    },function(e){
      $('gpsrow').style.display='';
      $('gpsmsg').textContent=e.code===1?'Localisation refusée : autorise-la dans les réglages du site, puis touche le bouton.':'GPS indisponible ('+e.message+').';
    },{enableHighAccuracy:true,maximumAge:2000});
  }
  $('gps').onclick=startGps;
  $('shape').onclick=function(){$('watch').classList.toggle('sq')};
  $('fmt').onclick=function(){decimal=!decimal;$('fmt').textContent='Format : '+(decimal?'12,400':'12+400');if(cur)renderPk(cur.pk);else renderPk(0)};
  /* ---------- navigation vers un PK ---------- */
  function posAtPk(line,pk){
    var L0=lines[line];if(!L0||!L0.length||pk<L0[0].pk||pk>L0[L0.length-1].pk)return null;
    var lo=0,hi=L0.length-1;while(lo<hi){var m=(lo+hi)>>1;if(L0[m].pk<pk)lo=m+1;else hi=m}
    var b=L0[lo],a=L0[Math.max(0,lo-1)],t=b.pk>a.pk?(pk-a.pk)/(b.pk-a.pk):0;
    return {lat:a.lat+(b.lat-a.lat)*t,lon:a.lon+(b.lon-a.lon)*t};
  }
  $('go').onclick=function(){
    var msg=$('gomsg'),v=pkNum($('pkin').value);
    if(isNaN(v)){msg.textContent='Saisis un PK, par exemple 258,4.';return}
    if(loading){msg.textContent='Base en cours de chargement…';return}
    var line=cur&&cur.d<2000?cur.l:DEF,pos=posAtPk(line,v);
    if(!pos){var L0=lines[line]||[];msg.textContent='PK hors de la ligne '+line+(L0.length?' (de '+L0[0].pk+' à '+L0[L0.length-1].pk+')':'')+'.';return}
    if(!acces.length){msg.textContent='Aucun point d’accès chargé (fichier acces.json manquant).';return}
    var k=Math.cos(pos.lat*Math.PI/180),best=null;
    acces.forEach(function(a){var d=Math.hypot((a.lon-pos.lon)*111.32*k,(a.lat-pos.lat)*110.57);if(!best||d<best.d)best={d:d,a:a}});
    msg.textContent='Accès le plus proche du PK '+fmtPk(v)+' (ligne '+line+') : '+best.a.n+' (PK '+fmtPk(best.a.pk)+'), à '+best.d.toFixed(1).replace('.',',')+' km. Ouverture de Google Maps…';
    window.open(navUrl(best.a),'_blank');
  };
  /* ---------- démarrage ---------- */
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
  initMap();
  startGps();
  fetch('pks.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
    var arr=[];
    j.l.forEach(function(L){var pk=0,la=0,lo=0;for(var i=0;i<L.p.length;i++){pk+=L.p[i];la+=L.a[i];lo+=L.o[i];arr.push({l:L.c,pk:pk/1000,lat:la/1e5,lon:lo/1e5})}});
    setData(arr);
    return fetch('acces.json').then(function(r){return r.ok?r.json():[]}).catch(function(){return[]});
  }).then(function(a){
    acces=a||[];loading=false;
    drawLine();drawAcces();
    if(last)onFix(last[0],last[1]);
  }).catch(function(){$('src').textContent='Base SNCF indisponible (réseau ?)'});
})();
</script>
</body>
</html>
